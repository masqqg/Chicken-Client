name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the jar to
        required: true
        default: v1.0.2
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Attach the jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          gh release upload "$tag" build/libs/chicken-client-*.jar --clobber
          gh release view "$tag" --json name,assets
